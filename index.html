<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>Monitor de passagens</title>
<style>
:root{--bg:#f4f5fb;--card:#fff;--tx:#1d1d2b;--mut:#6b6b80;--pri:#1b0088;--ac:#e8114b;--ok:#0a8a4a;--ln:#e3e4ee}
@media (prefers-color-scheme:dark){:root{--bg:#12121a;--card:#1c1c28;--tx:#ececf3;--mut:#9a9ab0;--pri:#8b7dff;--ac:#ff5c85;--ok:#3ecf8e;--ln:#2c2c3c}}
*{box-sizing:border-box}body{margin:0;font-family:system-ui,Segoe UI,Arial,sans-serif;background:var(--bg);color:var(--tx)}
header{background:var(--pri);color:#fff;padding:20px 16px}
header h1{margin:0;font-size:22px}header nav{margin-top:8px;display:flex;gap:8px;flex-wrap:wrap}
header nav a{color:#fff;background:rgba(255,255,255,.15);padding:4px 12px;border-radius:99px;text-decoration:none;font-size:14px}
main{max-width:1100px;margin:0 auto;padding:16px}
.viagem{margin-bottom:32px;scroll-margin-top:12px}
.viagem>h2{margin:8px 0 2px;font-size:20px}.viagem>.sub{color:var(--mut);font-size:14px;margin-bottom:12px}
.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px;margin-bottom:16px}
.card{background:var(--card);border:1px solid var(--ln);border-radius:12px;padding:14px}
.card .lb{font-size:12px;color:var(--mut);text-transform:uppercase;letter-spacing:.04em}
.card .vl{font-size:26px;font-weight:700;margin-top:4px}.card .sb{font-size:13px;color:var(--mut);margin-top:2px}
.ok{color:var(--ok)}.ac{color:var(--ac)}
section{background:var(--card);border:1px solid var(--ln);border-radius:12px;padding:14px;margin-bottom:16px}
section h3{margin:0 0 10px;font-size:16px}
.tw{overflow-x:auto}table{width:100%;border-collapse:collapse;font-size:14px}
th,td{padding:8px;border-bottom:1px solid var(--ln);text-align:left;white-space:nowrap}
th{color:var(--mut);font-weight:600;font-size:12px;text-transform:uppercase}
tr.best td{background:rgba(10,138,74,.12);font-weight:600}
.tag{display:inline-block;padding:2px 8px;border-radius:99px;font-size:11px;background:var(--ln)}
.chart svg{width:100%;height:auto;display:block}.gl{stroke:var(--ln);stroke-width:1}.tk{fill:var(--mut);font-size:12px}.tk2{fill:var(--mut);font-size:11px}
.leg{display:flex;gap:16px;flex-wrap:wrap;font-size:12px;color:var(--mut);margin-bottom:6px}.leg i{display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:4px;vertical-align:-1px}
footer{color:var(--mut);font-size:12px;text-align:center;padding:12px}
a{color:var(--pri)}
</style></head><body>

 cards+=card("Melhor tarifa agora",best?f(best.latam.preco):"-",best?dd(best.data)+" · "+best.latam.rota:"sem opção","ok");

 if(first&&last){const d=last-first;cards+=card("Variação desde a 1ª varredura",(d>0?"+":"")+f(d),"de "+f(first)+" para "+f(last),d<=0?"ok":"ac");}
 cards+=card("Varreduras feitas",ex.length,ALVO?"preço-alvo: "+f(ALVO):"sem preço-alvo definido");

 const CMP=B.comparar, VOL=r.some(x=>x.volta);
 let h="<tr><th>Partida</th>"+(VOL?"<th>Volta</th>":"")+"<th>"+R+"</th>"+(CMP?"<th>Só ida"+(B.comparar_quando?" ("+B.comparar_quando.slice(8,10)+"/"+B.comparar_quando.slice(5,7)+")":"")+"</th><th>Retorno sai por</th>":"")+(CRED?"<th>A pagar</th>":"")+"<th>Rota</th><th>Voos</th><th>Saída</th><th>Chegada</th><th>Duração</th><th>Opções</th><th>Mais barato (qualquer cia)</th><th></th></tr>";
 for(const x of ord){const l=x.latam,q=x.qualquer_cia, cls=(best&&x.data===best.data)?' class="best"':'';
  const si=CMP?CMP[x.data]:null;
  h+=`<tr${cls}><td>${dd(x.data)}</td>${VOL?`<td>${x.volta?dd(x.volta):"-"}</td>`:""}<td>${l?f(l.preco):'<span class="tag">sem opção</span>'}</td>${CMP?`<td>${f(si)}</td><td>${l&&si?f(l.preco-si):"-"}</td>`:""}${CRED?`<td>${l?f(pg(l.preco)):"-"}</td>`:""}<td>${l?l.rota:"-"}</td>
  <td>${l?l.voos.join(", "):"-"}</td><td>${l?l.saida.slice(11):"-"}</td><td>${l?l.chegada.slice(5):"-"}</td><td>${l?du(l.duracao_min):"-"}</td>
  <td>${x.qtd_latam}</td><td>${q?f(q.preco)+" · "+q.companhias.join("/"):"-"}</td>
  <td>${x.link?`<a href="${x.link}" target="_blank">abrir</a>`:""}</td></tr>`;}

 let notaCmp="";
 if(CMP){const rs=ord.filter(x=>x.latam&&CMP[x.data]!=null).map(x=>x.latam.preco-CMP[x.data]);
  const sep=B.volta_separada??Infinity;
  notaCmp=`<p class="sub" style="margin:10px 0 0">O retorno sai por <b>${f(Math.min(...rs))} a ${f(Math.max(...rs))}</b> a mais que só ida`+
   (isFinite(sep)?`. Comprar essa volta separada hoje (Gold Coast → Rio, só ida) custaria a partir de <b>${f(sep)}</b>.`:".")+
   ` Preços da tarifa mais barata; Standard + Full sai mais caro.</p>`;}
 const vq=ord.find(x=>x.volta), aviso=B.volta_desejada&&vq&&vq.volta<B.volta_desejada?` · volta pesquisada em ${dd(vq.volta)} (a de ${dd(B.volta_desejada)} ainda não está à venda)`:"";
 el.innerHTML=`<h2>${B.nome}</h2><div class="sub">${B.rota} · ${dd(ord[0].data)} a ${dd(ord[ord.length-1].data)}${aviso} · última varredura ${new Date(u.quando).toLocaleString("pt-BR")}</div>
  ${best&&best.retorno?`<div class="sub">Melhor: ida ${dd(best.data)} ${best.latam.rota} (${best.latam.voos.join(", ")}, ${du(best.latam.duracao_min)}) · volta ${dd(best.volta)} ${best.retorno.rota} (${best.retorno.voos.join(", ")}, ${du(best.retorno.duracao_min)}). Nas outras datas o preço é “a partir de”.</div>`:""}
  <div class="cards">${cards}</div>
  <section><h3>${CMP?"Ida e volta × só ida, por data de partida":"Preço por data de partida (última varredura)"}</h3><div class="chart" id="${id}g1"></div>${CMP?notaCmp:""}</section>
  <section><h3>Evolução da melhor tarifa ao longo do tempo</h3><div class="chart" id="${id}g2"></div></section>
  <section><h3>Detalhes da última varredura</h3><div class="tw"><table>${h}</table></div></section>`;

 const lbs=ord.map(x=>dc(x.data)), pre=ord.map(x=>x.latam?x.latam.preco:null);
 if(CMP){const ret=ord.map(x=>x.latam&&CMP[x.data]!=null?"retorno +"+f(x.latam.preco-CMP[x.data]):"");
  barras(document.getElementById(id+"g1"),lbs,[{label:"Só ida",data:ord.map(x=>CMP[x.data]??null),cor:"var(--ac)",tr:1},{label:"Ida e volta",data:pre,cor:"var(--pri)"}],f,ret);
 }else barras(document.getElementById(id+"g1"),lbs,[{label:R,data:pre,cor:"var(--pri)"}]
   .concat(R==="Qualquer companhia"||B.todas_cias?[]:[{label:"Qualquer companhia",data:ord.map(x=>x.qualquer_cia?x.qualquer_cia.preco:null),cor:"var(--ac)",tr:1}]),f);
 linhas(document.getElementById(id+"g2"),ex.map(e=>dh(e.quando)),[{label:"Melhor tarifa no período",data:ex.map(e=>e.melhor_latam),cor:"var(--pri)"}]
   .concat(ALVO?[{label:"Preço-alvo",data:ex.map(()=>ALVO),cor:"var(--ac)",tr:1}]:[]),f);
});
</script></body></html>
